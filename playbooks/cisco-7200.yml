---
- name: Install Cisco 7200 image on EVE-NG
  hosts: eve
  gather_facts: false

  vars:
    # EVE-NG上の一時作業ディレクトリ
    workdir: /tmp/cisco7200

    # Cisco 7200の元イメージ名
    image_bin: c7200-advipservicesk9-mz.152-4.S5.bin

    # 展開後のイメージ名
    image_file: c7200-advipservicesk9-mz.152-4.S5.image

    # Runner上のCiscoイメージ
    image_source: /opt/ansible/images/c7200-advipservicesk9-mz.152-4.S5.bin

    # EVE-NG上のDynamipsディレクトリ
    dynamips_dir: /opt/unetlab/addons/dynamips

    # CircleCIユーザーが使用する秘密鍵
    ssh_private_key: /home/circleci/.ssh/circleci_eveng

  tasks:
    - name: Check Cisco image file on Runner
      ansible.builtin.stat:
        path: "{{ image_source }}"
      delegate_to: localhost
      register: source_image
      changed_when: false

    - name: Verify Cisco image file exists on Runner
      ansible.builtin.assert:
        that:
          - source_image.stat.exists
          - source_image.stat.isreg
          - source_image.stat.size > 0
        fail_msg: >-
          Cisco image was not found or is empty on the Runner:
          {{ image_source }}
        success_msg: >-
          Cisco image was found on the Runner:
          {{ image_source }}
      delegate_to: localhost

    - name: Check whether circleci user can read Cisco image
      ansible.builtin.command:
        argv:
          - test
          - -r
          - "{{ image_source }}"
      delegate_to: localhost
      changed_when: false

    - name: Prepare temporary work directory on EVE-NG
      ansible.builtin.raw: |
        set -e
        rm -rf "{{ workdir }}"
        mkdir -p "{{ workdir }}"
        chmod 0755 "{{ workdir }}"
      changed_when: true

    - name: Copy Cisco image from Runner to EVE-NG
      ansible.builtin.command:
        argv:
          - scp
          - -i
          - "{{ ssh_private_key }}"
          - -o
          - BatchMode=yes
          - -o
          - StrictHostKeyChecking=yes
          - "{{ image_source }}"
          - "root@{{ inventory_hostname }}:{{ workdir }}/{{ image_bin }}"
      delegate_to: localhost
      register: scp_result
      changed_when: true

    - name: Verify copied BIN image on EVE-NG
      ansible.builtin.raw: |
        set -e
        test -f "{{ workdir }}/{{ image_bin }}"
        test -s "{{ workdir }}/{{ image_bin }}"
        ls -lh "{{ workdir }}/{{ image_bin }}"
      register: copied_image_result
      changed_when: false

    - name: Display copied BIN image information
      ansible.builtin.debug:
        var: copied_image_result.stdout_lines

    - name: Extract Cisco 7200 image on EVE-NG
      ansible.builtin.raw: |
        set -e
        cd "{{ workdir }}"
        rm -f "{{ image_file }}"
        unzip -p "{{ image_bin }}" > "{{ image_file }}"
        test -f "{{ image_file }}"
        test -s "{{ image_file }}"
        ls -lh "{{ image_file }}"
      register: extract_result
      changed_when: true

    - name: Display extracted image information
      ansible.builtin.debug:
        var: extract_result.stdout_lines

    - name: Install extracted image in Dynamips directory
      ansible.builtin.raw: |
        set -e
        mkdir -p "{{ dynamips_dir }}"
        cp -f "{{ workdir }}/{{ image_file }}" "{{ dynamips_dir }}/{{ image_file }}"
        chmod 0644 "{{ dynamips_dir }}/{{ image_file }}"
        test -f "{{ dynamips_dir }}/{{ image_file }}"
        test -s "{{ dynamips_dir }}/{{ image_file }}"
        ls -lh "{{ dynamips_dir }}/{{ image_file }}"
      register: install_result
      changed_when: true

    - name: Display installed image information
      ansible.builtin.debug:
        var: install_result.stdout_lines

    - name: Fix EVE-NG permissions
      ansible.builtin.raw: |
        set -e
        /opt/unetlab/wrappers/unl_wrapper -a fixpermissions
      register: fixpermissions_result
      changed_when: true

    - name: Verify final Cisco image
      ansible.builtin.raw: |
        set -e
        test -f "{{ dynamips_dir }}/{{ image_file }}"
        test -s "{{ dynamips_dir }}/{{ image_file }}"
        ls -lh "{{ dynamips_dir }}/{{ image_file }}"
      register: final_image_result
      changed_when: false

    - name: Display final Cisco image information
      ansible.builtin.debug:
        var: final_image_result.stdout_lines

    - name: Remove temporary work directory
      ansible.builtin.raw: |
        set -e
        rm -rf "{{ workdir }}"
      changed_when: true